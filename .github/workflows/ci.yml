name: CI

on:
  # Every branch push, so phase branches are checked before they reach main.
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Same Postgres major version and credentials as docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quiz_ai
          POSTGRES_PASSWORD: quiz_ai
          POSTGRES_DB: quiz_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz_ai -d quiz_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://quiz_ai:quiz_ai@localhost:5432/quiz_ai
      # CI has no secrets; the deployed app validates its environment at runtime.
      SKIP_ENV_VALIDATION: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # The runner image caches an older 24.x for days after a Node security release.
          check-latest: true
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:unused
      - run: npm test

      - run: npm run db:migrate
      - run: npm run test:db

      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - run: helm lint --strict deploy/helm/quiz-ai
      # Renders every template, so a broken template fails here instead of on the cluster.
      - run: helm template quiz-ai deploy/helm/quiz-ai > /dev/null
