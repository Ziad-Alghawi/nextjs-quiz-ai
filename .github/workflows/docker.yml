name: Docker

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Every job asks for the permissions it needs; nothing is granted by default.
permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runner
            image: ghcr.io/ziad-alghawi/nextjs-quiz-ai
          - target: migrate
            image: ghcr.io/ziad-alghawi/nextjs-quiz-ai-migrate

    steps:
      # Third-party actions are pinned to full commit SHAs: a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # Blocks the image only for CRITICAL/HIGH findings that already have a fixed version.
      - name: Trivy scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ matrix.image }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Every finding, fixable or not, goes to the repository's Security tab.
      - name: Trivy scan (report)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          skip-setup-trivy: true

      - if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: trivy-${{ matrix.target }}

  push:
    # Only merges into develop or main publish images; pull requests stop after the scan.
    if: ${{ github.event_name == 'push' }}
    needs: build-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runner
            image: ghcr.io/ziad-alghawi/nextjs-quiz-ai
          - target: migrate
            image: ghcr.io/ziad-alghawi/nextjs-quiz-ai-migrate

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # Rebuilt from the layer cache of the scanned build, so the pushed layers are the scanned ones.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
