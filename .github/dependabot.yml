# Monthly version updates, grouped into one pull request per package ecosystem. Major versions
# are left out because they need a code change; security fixes show up as Dependabot alerts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Each stripe release types a newer API version, and the code's apiVersion must match the
      # webhook endpoint's version in the Stripe dashboard, so both are updated together by hand
      - dependency-name: stripe
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
