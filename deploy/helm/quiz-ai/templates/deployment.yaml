apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "quiz-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "quiz-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quiz-ai.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          ports:
            - name: http
              containerPort: 3000
          # /api/health checks the database: it decides whether the pod gets traffic,
          # but a database outage must not restart healthy pods, so liveness only checks the port.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # The Next server stops at once on SIGTERM; waiting first lets the Service stop sending it
          # new requests during a rolling update.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "quiz-ai.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # The only paths the server writes to: Next's image/fetch cache and temp files.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
