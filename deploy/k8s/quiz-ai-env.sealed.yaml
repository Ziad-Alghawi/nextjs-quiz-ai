# The app's environment for the local cluster, encrypted with the cluster's sealed-secrets key: only the
# controller in that cluster can decrypt it. Local values only (dummy API keys); re-seal after creating a
# new cluster (see the README).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: quiz-ai-env
  namespace: quiz-ai
spec:
  encryptedData:
    APP_URL: 
    AUTH_SECRET: 
    CRON_SECRET: 
    DATABASE_URL: 
    EMAIL_TRANSPORT: 
    GEMINI_API_KEY: 
    GOOGLE_CLIENT_ID: 
    GOOGLE_CLIENT_SECRET: 
    STRIPE_PRICE_ID: 
    STRIPE_SECRET_KEY: 
    STRIPE_WEBHOOK_SECRET: 
    STRIPE_YEARLY_PRICE_ID: 
  template:
    metadata:
      name: quiz-ai-env
      namespace: quiz-ai
